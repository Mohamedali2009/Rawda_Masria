<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روضة مصرية - الموسوعة التعليمية الشاملة للأطفال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2D3436;
            --light: #F7F9FC;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 15px;
            text-align: center;
            color: white;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 900;
            margin-bottom: 3px;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 12px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        header p {
            font-size: 0.8rem;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: white;
            border: none;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--dark);
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .tab-btn.active {
            background: var(--accent);
            transform: translateY(-2px);
        }

        main {
            flex: 1;
            padding: 15px;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .section-title {
            text-align: center;
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: 900;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .card {
            background: white;
            border-radius: 15px;
            height: 95px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            transition: transform 0.1s;
        }

        .card:active {
            transform: scale(0.92);
        }

        .card-main {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--primary);
        }

        .card-sub {
            font-size: 0.7rem;
            color: #777;
            margin-top: 3px;
            font-weight: 700;
            text-align: center;
            padding: 0 5px;
        }

        .color-card {
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }

        footer {
            background: var(--dark);
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 0.78rem;
            margin-top: auto;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        footer span {
            color: var(--accent);
            font-weight: bold;
        }

        /* النافذة المنبثقة */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            width: 80%;
            max-width: 280px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .modal-display {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .modal-text {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--dark);
        }

        .close-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 20px;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

        <div class="brand-subtitle">إشراف: محمد علي محمد علي سالم</div>
        <p>موسوعة تفاعلية ضخمة لتعلم الكلمات والألوان والنطق!</p>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('ar', this)">عربي (100)</button>
            <button class="tab-btn" onclick="switchTab('en', this)">English (100)</button>
            <button class="tab-btn" onclick="switchTab('colors', this)">الألوان (50)</button>
        </div>
    </header>

    <main>
        <!-- قسم العربية (100 كلمة) -->
        <section id="ar" class="section active">

            <div class="grid-container" id="ar-grid"></div>
        </section>

        <!-- قسم الإنجليزية (100 كلمة) -->
        <section id="en" class="section">
            <h2 class="section-title">English Vocabulary</h2>
            <div class="grid-container" id="en-grid"></div>
        </section>

        <!-- قسم الألوان (50 لوناً) -->
        <section id="colors" class="section">
            <h2 class="section-title">موسوعة الألوان (50 لوناً)</h2>
            <div class="grid-container" id="colors-grid"></div>
        </section>
    </main>

    <div class="modal" id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-display" id="modal-display">أ</div>
            <div class="modal-text" id="modal-text">ألف</div>
            <button class="close-btn" onclick="closeModal()">حسناً 👍</button>
        </div>
    </div>

    </footer>

        // تعبئة البيانات في الشاشات
        function fillGrid(id, data, lang) {
            const grid = document.getElementById(id);
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="card-main">${item.c}</div><div class="card-sub">${item.n}</div>`;
                card.onclick = () => {
                    speak(item.n, lang);
                    showModal(item.c, item.n);
                };
                grid.appendChild(card);
            });
        }

        function fillColors() {
            const grid = document.getElementById('colors-grid');
            colorsList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card color-card';
                card.style.backgroundColor = item.h;
                if(item.darkText) {
                    card.style.color = '#2D3436';
                }
                card.innerHTML = `<div class="card-main" style="font-size:1.2rem;">🎨</div><div class="card-sub" style="color: ${item.darkText ? '#2D3436' : '#fff'};">${item.n}</div>`;
                card.onclick = () => {
                    speak(item.n, 'ar-SA');
                    showModal('🎨', item.n);
                };
                grid.appendChild(card);
            });
        }

        fillGrid('ar-grid', arWords, 'ar-SA');
        fillGrid('en-grid', enWords, 'en-US');
        fillColors();

        // خاصية النطق الصوتي التفاعلي
        function speak(text, lang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = lang;
                utter.rate = 0.8;
                window.speechSynthesis.speak(utter);
            }
        }

        function switchTab(secId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(secId).classList.add('active');
            btn.classList.add('active');
        }

        function showModal(c, n) {
            document.getElementById('modal-display').innerText = c;
            document.getElementById('modal-text').innerText = n;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
